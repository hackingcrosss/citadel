version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: infrared-postgres
    environment:
      POSTGRES_DB: infrared
      POSTGRES_USER: infrared
      # POSTGRES_PASSWORD comes from the secrets file env_file below. The
      # value is only consulted by postgres on first init (creates the
      # superuser); subsequent boots use whatever is in pg_authid, which
      # `flask` migrations and the migrate-postgres-password.sh helper
      # keep in sync.
    env_file:
      - ${INFRARED_SECRETS_FILE:-${HOME}/.config/infrared/secrets.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port mapping — DB is reachable only from inside the docker
    # bridge network. Host-side ops use `docker compose exec postgres psql ...`.
    expose:
      - "5432"
    networks:
      - infrared-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: infrared-redis
    # Shell wrapper so $REDIS_PASSWORD (from env_file) is dereferenced by the
    # container's shell at start. redis-server itself doesn't expand env vars
    # in CLI args, so the indirection is required. `exec` makes redis-server
    # PID 1 so signals propagate correctly.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --protected-mode yes
    env_file:
      - ${INFRARED_SECRETS_FILE:-${HOME}/.config/infrared/secrets.env}
    # No host port mapping — Redis / the Celery broker are reachable only from
    # inside the docker bridge network. Host-side ops use `docker compose exec
    # redis redis-cli`.
    expose:
      - "6379"
    networks:
      - infrared-network
    restart: unless-stopped

  web:
    build: .
    container_name: infrared-web
    command: gunicorn -b 0.0.0.0:5000 "app:create_app()" --reload
    volumes:
      - ./app:/app/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
      - ${INFRARED_SECRETS_FILE:-${HOME}/.config/infrared/secrets.env}
    depends_on:
      - postgres
      - redis
    networks:
      - infrared-network
    restart: unless-stopped

  celery:
    build: .
    container_name: infrared-celery
    command: celery -A app.tasks.celery_app worker --beat --loglevel=info
    volumes:
      - ./app:/app/app
    env_file:
      - .env
      - ${INFRARED_SECRETS_FILE:-${HOME}/.config/infrared/secrets.env}
    depends_on:
      - postgres
      - redis
    networks:
      - infrared-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: infrared-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - infrared-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  infrared-network:
    driver: bridge