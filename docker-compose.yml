version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: citadel-postgres
    environment:
      POSTGRES_DB: citadel
      POSTGRES_USER: citadel
      # POSTGRES_PASSWORD comes from the secrets file env_file below. The
      # value is only consulted by postgres on first init (creates the
      # superuser); subsequent boots use whatever is in pg_authid, which
      # `flask` migrations and the migrate-postgres-password.sh helper
      # keep in sync.
    env_file:
      - ${CITADEL_SECRETS_FILE:-${HOME}/.config/citadel/secrets.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port mapping — DB is reachable only from inside the docker
    # bridge network. Host-side ops use `docker compose exec postgres psql ...`.
    expose:
      - "5432"
    networks:
      - citadel-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: citadel-redis
    # Shell wrapper so $REDIS_PASSWORD (from env_file) is dereferenced by the
    # container's shell at start. redis-server itself doesn't expand env vars
    # in CLI args, so the indirection is required. `exec` makes redis-server
    # PID 1 so signals propagate correctly.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --protected-mode yes
    env_file:
      - ${CITADEL_SECRETS_FILE:-${HOME}/.config/citadel/secrets.env}
    # No host port mapping — Redis / the Celery broker are reachable only from
    # inside the docker bridge network. Host-side ops use `docker compose exec
    # redis redis-cli`.
    expose:
      - "6379"
    networks:
      - citadel-network
    restart: unless-stopped

  web:
    build: .
    container_name: citadel-web
    # NOTE: --reload is intentionally NOT here. In production it tails the
    # mounted source tree and reloads on file change, which combined with the
    # ./app:/app/app bind-mount turns any in-container file write into a
    # restart-loop / RCE primitive. Local development that wants live reload
    # should copy docker-compose.override.yml.example to docker-compose.override.yml.
    command: gunicorn -b 0.0.0.0:5000 "app:create_app()"
    volumes:
      - ./app:/app/app
      # NOTE: /var/run/docker.sock is intentionally NOT mounted here.
      # Production uses a remote Docker host configured via Settings →
      # Docker → Host URL, so the local socket is unused. Mounting it
      # is a container-escape primitive (any in-container RCE → host root).
      # Local development that needs the socket should copy
      # docker-compose.override.yml.example to docker-compose.override.yml.
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
      - ${CITADEL_SECRETS_FILE:-${HOME}/.config/citadel/secrets.env}
    depends_on:
      - postgres
      - redis
    networks:
      - citadel-network
    restart: unless-stopped

  celery:
    build: .
    container_name: citadel-celery
    command: celery -A app.tasks.celery_app worker --beat --loglevel=info
    volumes:
      - ./app:/app/app
    env_file:
      - .env
      - ${CITADEL_SECRETS_FILE:-${HOME}/.config/citadel/secrets.env}
    depends_on:
      - postgres
      - redis
    networks:
      - citadel-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: citadel-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - citadel-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  citadel-network:
    driver: bridge